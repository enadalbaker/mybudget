<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميزانيتي">
<title>ميزانيتي الشهرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ecefea;--card:#fafbf8;--ink:#15241f;--mute:#5d6b65;--line:#d5dbd3;--acc:#0e6a62;--accsoft:#d6ebe7;--warn:#a96a0f;--warnsoft:#f4e5c8;--bad:#a8402e;--badsoft:#f3d9d2;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#17231f;--ink:#e7efe9;--mute:#9db0a7;--line:#2a3a34;--acc:#4fc2b6;--accsoft:#173a36;--warn:#e0a84a;--warnsoft:#3a2d12;--bad:#ea8b78;--badsoft:#3d1f19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1815;--card:#17231f;--ink:#e7efe9;--mute:#9db0a7;--line:#2a3a34;--acc:#4fc2b6;--accsoft:#173a36;--warn:#e0a84a;--warnsoft:#3a2d12;--bad:#ea8b78;--badsoft:#3d1f19;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=month]{width:auto}
.num{direction:ltr;text-align:right}
.hero{padding:20px 16px}
.big{font-size:44px;font-weight:700;line-height:1.1;direction:ltr;text-align:right}
.big.neg{color:var(--bad)}
.unit{font-size:15px;color:var(--mute);font-weight:400}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:14px 0 6px}
.bar i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 110px 44px;gap:8px;margin-bottom:8px}
.del{border:1px solid var(--line);background:transparent;color:var(--bad);border-radius:10px;font-size:20px;cursor:pointer;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer;min-height:36px}
.btn{font:inherit;font-weight:500;width:100%;min-height:46px;border:0;border-radius:10px;background:var(--acc);color:var(--bg);cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{display:flex;justify-content:space-between;margin-top:10px;font-weight:500}
.alloc{display:grid;gap:8px;margin:10px 0}
.a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-radius:10px;background:var(--accsoft)}
.a b{direction:ltr;white-space:nowrap}
.a small{display:block;color:var(--mute);font-size:12px;line-height:1.5}
.note{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
.note.warn{background:var(--warnsoft)}
.note.bad{background:var(--badsoft)}
.note.ok{background:var(--accsoft)}
.fine{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
.empty{color:var(--mute);font-size:14px;margin:6px 0}
</style>
</head>
<body>
<main>
<div class="top">
  <h1>ميزانيتي الشهرية</h1>
  <input type="month" id="month" aria-label="الشهر">
</div>

<section class="hero">
  <label>المتبقي بعد الالتزامات</label>
  <div class="big" id="rem">0 <span class="unit" id="cur1">د.ك</span></div>
  <div class="bar" aria-hidden="true"><i id="b1" style="background:var(--warn)"></i><i id="b2" style="background:var(--acc)"></i></div>
  <div class="legend"><span id="l1">الالتزامات 0%</span><span id="l2">المتبقي 0%</span></div>
</section>

<section>
  <h2>الراتب</h2>
  <label for="sal">راتب هذا الشهر</label>
  <input class="num" id="sal" inputmode="decimal" placeholder="0">
</section>

<section>
  <h2>الالتزامات الشهرية</h2>
  <div id="list"></div>
  <div class="chips" id="chips"></div>
  <button class="btn" id="add">إضافة التزام</button>
  <div class="tot"><span>مجموع الالتزامات</span><span class="num" id="tot">0</span></div>
</section>

<section>
  <h2>إعدادات المحفظة</h2>
  <div class="two">
    <div>
      <label for="risk">مستوى المخاطرة</label>
      <select id="risk"><option value="c">محافظ</option><option value="b" selected>متوازن</option><option value="a">جريء</option></select>
    </div>
    <div>
      <label for="ef">صندوق الطوارئ الحالي</label>
      <input class="num" id="ef" inputmode="decimal" placeholder="0">
    </div>
  </div>
  <p class="empty">حدّث رصيد صندوق الطوارئ كل شهر بعد التحويل إليه.</p>
</section>

<section>
  <h2>توزيع المتبقي</h2>
  <div id="advice"></div>
</section>

<p class="fine">البيانات تُحفظ على جهازك فقط. هذه اقتراحات عامة وليست نصيحة مالية مرخّصة - طور بواسطة عناد البكر .</p>
</main>

<script>
(function(){
var KEY="budget_v1",CUR="د.ك";
var S={months:{},risk:"b",ef:0};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.months)S=p;}}catch(e){}
var $=function(i){return document.getElementById(i)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function num(v){v=String(v||"").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[٫,]/g,".").replace(/[^0-9.\-]/g,"");var n=parseFloat(v);return isNaN(n)?0:n}
function fmt(n){return (Math.round(n*1000)/1000).toLocaleString("en-US",{maximumFractionDigits:3})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var now=new Date(),cur=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
function M(){
  if(!S.months[cur]){
    var keys=Object.keys(S.months).sort(),prev=null;
    for(var i=keys.length-1;i>=0;i--){if(keys[i]<cur){prev=keys[i];break}}
    if(!prev&&keys.length)prev=keys[keys.length-1];
    var items=prev?S.months[prev].items.map(function(x){return {n:x.n,a:x.a}}):[];
    S.months[cur]={sal:prev?S.months[prev].sal:0,items:items};
  }
  return S.months[cur];
}
var CH=["إيجار","قسط سيارة","قرض","فواتير","اشتراكات","مصروف البيت","تعليم"];
$("chips").innerHTML=CH.map(function(c){return '<button class="chip" data-n="'+c+'">+ '+c+'</button>'}).join("");
$("chips").onclick=function(e){var n=e.target.getAttribute("data-n");if(n){M().items.push({n:n,a:0});save();list();}};
$("add").onclick=function(){M().items.push({n:"",a:0});save();list();var r=document.querySelectorAll(".nm");if(r.length)r[r.length-1].focus();};
function list(){
  var m=M(),h="";
  if(!m.items.length)h='<p class="empty">لا توجد التزامات بعد. أضف أول التزام أو اختر من الأسفل.</p>';
  m.items.forEach(function(x,i){
    h+='<div class="row"><input class="nm" data-i="'+i+'" value="'+esc(x.n)+'" placeholder="اسم الالتزام" aria-label="اسم الالتزام"><input class="num am" data-i="'+i+'" inputmode="decimal" value="'+(x.a||"")+'" placeholder="0" aria-label="المبلغ"><button class="del" data-i="'+i+'" aria-label="حذف">×</button></div>';
  });
  $("list").innerHTML=h;update();
}
$("list").addEventListener("input",function(e){
  var i=e.target.getAttribute("data-i");if(i===null)return;
  if(e.target.classList.contains("nm"))M().items[i].n=e.target.value;
  else M().items[i].a=num(e.target.value);
  save();update();
});
$("list").addEventListener("click",function(e){
  if(e.target.classList.contains("del")){M().items.splice(e.target.getAttribute("data-i"),1);save();list();}
});
$("sal").oninput=function(){M().sal=num(this.value);save();update();};
$("risk").onchange=function(){S.risk=this.value;save();update();};
$("ef").oninput=function(){S.ef=num(this.value);save();update();};
$("month").onchange=function(){if(this.value){cur=this.value;load();}};
function note(c,t){return '<div class="note '+c+'">'+t+'</div>'}
function update(){
  var m=M(),sal=m.sal,ob=m.items.reduce(function(s,x){return s+(x.a||0)},0),rem=sal-ob;
  var ratio=sal>0?ob/sal:0;
  $("tot").textContent=fmt(ob)+" "+CUR;
  var r=$("rem");r.className="big"+(rem<0?" neg":"");
  r.innerHTML=fmt(rem)+' <span class="unit">'+CUR+'</span>';
  var p1=sal>0?Math.min(100,ob/sal*100):0,p2=sal>0?Math.max(0,100-p1):0;
  $("b1").style.width=p1+"%";$("b2").style.width=p2+"%";
  $("l1").textContent="الالتزامات "+Math.round(ratio*100)+"%";
  $("l2").textContent="المتبقي "+(sal>0?Math.round(Math.max(0,rem)/sal*100):0)+"%";
  var h="";
  if(sal<=0){$("advice").innerHTML=note("warn","أدخل راتب الشهر لتظهر لك الاقتراحات.");return}
  if(rem<=0){
    var top=m.items.slice().sort(function(a,b){return b.a-a.a}).slice(0,3).filter(function(x){return x.a>0}).map(function(x){return esc(x.n||"بدون اسم")}).join("، ");
    h=note("bad","التزاماتك تساوي الراتب أو تتجاوزه بمقدار "+fmt(-rem)+" "+CUR+". لا يُنصح بأي استثمار أو تداول هذا الشهر.")+
      note("warn","ابدأ بمراجعة أكبر البنود"+(top?": "+top:"")+". فكّر في إعادة جدولة قرض أو تخفيض مصروف مرن.");
    $("advice").innerHTML=h;return;
  }
  var mo={c:6,b:4,a:3}[S.risk],efShare0={c:.6,b:.5,a:.4}[S.risk];
  var target=ob*mo,gap=Math.max(0,target-S.ef);
  var efAmt=Math.min(gap,rem*efShare0),rest=rem-efAmt;
  var sp={c:[.5,.45,.05],b:[.6,.25,.15],a:[.6,.1,.3]}[S.risk].slice();
  if(ratio>0.5){var mv=sp[2]/2;sp[2]-=mv;sp[1]+=mv;}
  var inv=rest*sp[0],cash=rest*sp[1],trd=rest*sp[2];
  var rows=[];
  if(efAmt>0)rows.push(["صندوق الطوارئ",efAmt,"الهدف "+fmt(target)+" "+CUR+" ("+mo+" أشهر التزامات). المتبقي للوصول: "+fmt(gap)+" "+CUR]);
  rows.push(["استثمار طويل الأجل",inv,"صناديق مؤشرات أو أسهم قيادية بتوزيع تدريجي"]);
  rows.push(["ادخار نقدي وأهداف قريبة",cash,"ودائع أو سيولة لمصاريف غير متوقعة وأهداف خلال سنة"]);
  rows.push(["رأس مال تداول",trd,"مبلغ تقبل خسارته بالكامل دون أن يؤثر على التزاماتك"]);
  h='<div class="alloc">'+rows.map(function(x){return '<div class="a"><span>'+x[0]+'<small>'+x[2]+'</small></span><b>'+fmt(x[1])+" "+CUR+'</b></div>'}).join("")+'</div>';
  if(ratio>0.7)h+=note("bad","التزاماتك "+Math.round(ratio*100)+"% من الراتب، وهذا مرتفع جدًا. الأولوية لخفضها قبل زيادة المخاطرة.");
  else if(ratio>0.5)h+=note("warn","التزاماتك "+Math.round(ratio*100)+"% من الراتب. خفّضنا حصة التداول وزدنا السيولة تلقائيًا.");
  else h+=note("ok","نسبة التزاماتك "+Math.round(ratio*100)+"% من الراتب، وهي في نطاق مريح.");
  if(gap>0)h+=note("warn","صندوق الطوارئ لم يكتمل بعد، فلا ترفع حصة التداول قبل اكتماله.");
  else h+=note("ok","صندوق الطوارئ مكتمل، وكامل المتبقي يتوزع على الاستثمار والسيولة والتداول.");
  if(trd>rem*0.3)h+=note("warn","حصة التداول أعلى من 30% من المتبقي. فكّر في تخفيضها.");
  $("advice").innerHTML=h;
}
function load(){
  var m=M();
  $("month").value=cur;
  $("sal").value=m.sal||"";
  $("risk").value=S.risk;
  $("ef").value=S.ef||"";
  list();save();
}
load();
})();
</script>
</body>
</html>
